application:
  subdomain: opengym
  multi_instance: false
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://web:80/
services:
  api:
    # upstream: ghcr.io/duartesantos8/opengym-api:1.4.1
    image: ghcr.1ms.run/duartesantos8/opengym-api:1.4.1
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - TRUST_PROXY=1
      # passkey（WebAuthn）：RP_ID 为访问主机名，ORIGIN 为完整来源
      - RP_ID=${LAZYCAT_SUBDOMAIN}.${LAZYCAT_BOX_DOMAIN}
      - ORIGIN=https://${LAZYCAT_SUBDOMAIN}.${LAZYCAT_BOX_DOMAIN}
      - RP_NAME=openGym
    binds:
      - /lzcapp/var/data:/data
      - /lzcapp/var/coach-auth:/coach-auth
    depends_on:
      - media
  web:
    # upstream: ghcr.io/duartesantos8/opengym-web:1.4.1
    image: ghcr.1ms.run/duartesantos8/opengym-web:1.4.1
    depends_on:
      - api
      - media
    environment:
      - NGINX_PORT=80
      - BACKEND=api
      - PORT=3000
      - RESOLVER=127.0.0.11
      - MEDIA_UPLOAD_MAX=48m
    binds:
      - /lzcapp/var/media/img:/usr/share/nginx/html/img
      - /lzcapp/var/media/gif:/usr/share/nginx/html/gif
  media:
    # 一次性下载训练图片/GIF（~140MB，来自上游数据集；按上游 NOTICE 由实例自行
    # 下载、不随包重新分发），完成后保持运行以便共享卷持续挂载。
    image: docker.1ms.run/alpine/git:latest
    command: >-
      sh -c 'if [ -z "$(ls -A /out/img 2>/dev/null)" ]; then echo "downloading exercise media..."; git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds && mkdir -p /out/img /out/gif && cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/ && echo "media ready"; fi; exec sleep infinity'
    binds:
      - /lzcapp/var/media/img:/out/img
      - /lzcapp/var/media/gif:/out/gif
